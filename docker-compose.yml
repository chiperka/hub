# Chiperka Hub with one worker — http://localhost:8080
#   docker compose up -d
#   docker compose up -d --scale worker=3   # more workers
services:
  hub:
    image: finie/chiperka-hub:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CHIPERKA_AUTH: "disabled"            # trusted single-user mode; remove for shared instances
      # CHIPERKA_PUBLIC_URL: https://chiperka.example.com
      # CHIPERKA_ADMIN_EMAIL: admin@example.com
      # CHIPERKA_ADMIN_PASSWORD: change-me-please
      # CHIPERKA_WORKER_JOIN_TOKEN: change-me  # required for workers to join once auth is enabled
    volumes:
      - hub-data:/data

  worker:
    image: finie/chiperka-worker:latest
    restart: unless-stopped
    depends_on: [hub]
    environment:
      CHIPERKA_API_URL: http://hub:8080
      # CHIPERKA_WORKER_TOKEN: change-me       # the hub's join token, when set
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  hub-data:
