# Chiperka Hub — http://localhost:8080
#   docker compose up -d
services:
  hub:
    image: finie/chiperka-hub:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CHIPERKA_AUTH: "disabled"            # trusted single-user mode; remove for shared instances
      # CHIPERKA_PUBLIC_URL: https://chiperka.example.com
      # CHIPERKA_ADMIN_EMAIL: admin@example.com
      # CHIPERKA_ADMIN_PASSWORD: change-me-please
      CHIPERKA_LOCAL_WORKER: "1"           # run tests on this machine (needs the Docker socket below)
    volumes:
      - hub-data:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  hub-data:
